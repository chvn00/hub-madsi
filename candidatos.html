<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apertura de Cohortes · MADSI</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: #fff;
  color: #111;
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* HEADER */
header {
  background: linear-gradient(135deg, #1e1e1e 0%, #2c2c2c 100%);
  border-bottom: 3px solid #F5C300;
  padding: 0 2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 68px;
  gap: 1rem;
}
.header-left { display: flex; align-items: center; gap: .9rem; }
.logo-wrap {
  width: 40px; height: 40px; border-radius: 50%;
  background: #fff; overflow: hidden; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
.header-title h1 { font-size: .95rem; font-weight: 700; color: #fff; }
.header-title p  { font-size: .7rem; color: #aaa; }
.btn-back {
  display: inline-flex; align-items: center; gap: .35rem;
  padding: .4rem .85rem; border-radius: 7px; font-size: .78rem; font-weight: 600;
  background: rgba(255,255,255,.1); color: #fff; text-decoration: none;
  border: 1px solid rgba(255,255,255,.2); transition: background .15s;
}
.btn-back:hover { background: rgba(255,255,255,.18); }

/* MAIN */
main { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

/* KPIs */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .85rem;
  margin-bottom: 2rem;
}
.kpi {
  border: 1.5px solid #E5E7EB;
  border-radius: 10px;
  padding: .9rem 1.1rem;
}
.kpi-label { font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: #6B7280; margin-bottom: .3rem; }
.kpi-value { font-size: 1.75rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-total    .kpi-value { color: #111; }
.kpi-inscrito .kpi-value { color: #1D4ED8; }
.kpi-entrev   .kpi-value { color: #D97706; }
.kpi-admitido .kpi-value { color: #059669; }
.kpi-matric   .kpi-value { color: #7C3AED; }

/* PAGE TOOLBAR */
.page-toolbar {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap;
}
.page-toolbar h2 { font-size: 1.1rem; font-weight: 700; }

.btn-primary {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .55rem 1.2rem; border-radius: 8px; font-size: .84rem; font-weight: 700;
  background: #F5C300; color: #111; border: none; cursor: pointer;
  transition: filter .15s; white-space: nowrap;
}
.btn-primary:hover { filter: brightness(.9); }

/* COHORT CARD */
.cohort-card {
  border: 1.5px solid #E5E7EB;
  border-radius: 12px;
  margin-bottom: 1.25rem;
  overflow: hidden;
}

.cohort-head {
  display: flex; align-items: center; gap: .75rem;
  padding: .85rem 1.25rem;
  background: #FAFAFA;
  border-bottom: 1px solid #E5E7EB;
  cursor: pointer;
  user-select: none;
}
.cohort-head:hover { background: #F3F4F6; }

.cohort-chevron {
  font-size: .75rem; color: #9CA3AF;
  transition: transform .2s; flex-shrink: 0;
}
.cohort-card.open .cohort-chevron { transform: rotate(90deg); }

.cohort-name { font-weight: 700; font-size: .95rem; flex: 1; }
.cohort-meta { font-size: .78rem; color: #6B7280; }
.cohort-badge {
  background: #EEF2FF; color: #1D4ED8;
  border-radius: 20px; padding: .15rem .6rem;
  font-size: .72rem; font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.cohort-actions-head {
  display: flex; gap: .5rem; margin-left: .5rem;
}
.btn-sm {
  padding: .3rem .75rem; border-radius: 6px; font-size: .76rem; font-weight: 600;
  cursor: pointer; border: 1.5px solid #E5E7EB; background: #fff; color: #374151;
  transition: all .15s; white-space: nowrap;
}
.btn-sm:hover { border-color: #9CA3AF; background: #F9FAFB; }
.btn-sm.danger:hover { border-color: #EF4444; color: #EF4444; background: #FEF2F2; }
.btn-sm.accent { background: #111; color: #F5C300; border-color: #111; }
.btn-sm.accent:hover { background: #333; border-color: #333; }

/* COHORT BODY */
.cohort-body { display: none; padding: 1.1rem 1.25rem; }
.cohort-card.open .cohort-body { display: block; }

/* CANDIDATES TABLE */
.cand-toolbar {
  display: flex; gap: .6rem; align-items: center; margin-bottom: .85rem; flex-wrap: wrap;
}
.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; padding: .48rem .8rem .48rem 2rem;
  border: 1.5px solid #E5E7EB; border-radius: 7px;
  font-size: .82rem; color: #111; background: #fff; outline: none;
}
.search-box input:focus { border-color: #1D4ED8; }
.search-box .ico { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%);
  font-size: .82rem; color: #9CA3AF; pointer-events: none; }

select.filter {
  padding: .48rem .7rem; border: 1.5px solid #E5E7EB; border-radius: 7px;
  font-size: .82rem; color: #111; background: #fff; outline: none; cursor: pointer;
}

.btn-export {
  padding: .48rem .9rem; border-radius: 7px; font-size: .76rem; font-weight: 600;
  border: 1.5px solid #E5E7EB; background: #fff; color: #6B7280; cursor: pointer;
  transition: all .15s;
}
.btn-export:hover { border-color: #9CA3AF; color: #111; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
thead th {
  padding: .6rem .85rem; text-align: left;
  font-size: .68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: #9CA3AF;
  border-bottom: 1.5px solid #E5E7EB;
}
tbody tr { border-bottom: 1px solid #F3F4F6; transition: background .1s; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #FAFAFA; }
tbody td { padding: .65rem .85rem; vertical-align: middle; }

.td-name  { font-weight: 600; font-size: .88rem; }
.td-doc   { font-size: .78rem; color: #6B7280; margin-top: 1px; }
.td-small { font-size: .8rem; color: #374151; }
.td-gray  { font-size: .8rem; color: #6B7280; }
.td-notes { font-size: .78rem; color: #6B7280; max-width: 160px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pill {
  display: inline-flex; align-items: center; gap: .25rem;
  padding: .18rem .6rem; border-radius: 20px; font-size: .71rem; font-weight: 700;
}
.p-inscrito    { background: #EEF2FF; color: #1D4ED8; }
.p-entrevistado{ background: #FEF3C7; color: #B45309; }
.p-admitido    { background: #D1FAE5; color: #065F46; }
.p-matriculado { background: #EDE9FE; color: #5B21B6; }
.p-desistio    { background: #FEE2E2; color: #B91C1C; }

.td-acts { display: flex; gap: .35rem; }
.btn-icon {
  width: 26px; height: 26px; border-radius: 5px;
  border: 1px solid #E5E7EB; background: transparent;
  cursor: pointer; font-size: .78rem; display: flex;
  align-items: center; justify-content: center; color: #9CA3AF;
  transition: all .15s;
}
.btn-icon:hover { background: #F3F4F6; color: #111; border-color: #9CA3AF; }
.btn-icon.del:hover { background: #FEF2F2; color: #EF4444; border-color: #EF4444; }

.empty { padding: 2rem; text-align: center; color: #9CA3AF; font-size: .84rem; }

.empty-cohorts {
  border: 2px dashed #E5E7EB; border-radius: 12px;
  padding: 3.5rem; text-align: center; color: #9CA3AF;
}
.empty-cohorts p { margin-top: .5rem; font-size: .84rem; }
.empty-cohorts button { margin-top: 1.25rem; }

/* MODALS */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity .18s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: #fff; border-radius: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
  width: min(520px, 95vw); max-height: 90vh;
  overflow-y: auto; padding: 1.75rem;
  transform: translateY(10px); transition: transform .18s;
}
.overlay.open .modal { transform: translateY(0); }

.modal-hd {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 1.35rem;
}
.modal-hd h2 { font-size: 1rem; font-weight: 700; }
.btn-close {
  width: 28px; height: 28px; border-radius: 6px;
  border: 1px solid #E5E7EB; background: transparent;
  cursor: pointer; font-size: .9rem; display: flex;
  align-items: center; justify-content: center; color: #6B7280;
}
.btn-close:hover { background: #F3F4F6; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
.fg { display: flex; flex-direction: column; gap: .35rem; }
.fg.full { grid-column: 1/-1; }
label { font-size: .72rem; font-weight: 700; color: #6B7280;
  text-transform: uppercase; letter-spacing: .05em; }
input[type=text], input[type=email], input[type=tel],
input[type=date], select.fs, textarea {
  padding: .55rem .8rem; border: 1.5px solid #E5E7EB; border-radius: 8px;
  background: #fff; color: #111; font-size: .86rem;
  outline: none; transition: border .15s; font-family: inherit;
}
input:focus, select.fs:focus, textarea:focus { border-color: #1D4ED8; }
textarea { resize: vertical; min-height: 68px; }

.modal-ft {
  display: flex; justify-content: flex-end; gap: .65rem;
  margin-top: 1.35rem; padding-top: 1.1rem; border-top: 1px solid #F3F4F6;
}
.btn-cancel {
  padding: .55rem 1.1rem; border-radius: 8px; font-size: .84rem; font-weight: 600;
  background: transparent; color: #6B7280; border: 1.5px solid #E5E7EB; cursor: pointer;
}
.btn-cancel:hover { border-color: #9CA3AF; color: #111; }
.btn-save {
  padding: .55rem 1.3rem; border-radius: 8px; font-size: .84rem; font-weight: 700;
  background: #111; color: #F5C300; border: none; cursor: pointer; transition: filter .15s;
}
.btn-save:hover { filter: brightness(1.4); }

@media (max-width: 860px) { .kpi-row { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 560px) {
  header { padding: 0 1rem; }
  main { padding: 1.2rem 1rem 3rem; }
  .kpi-row { grid-template-columns: repeat(2,1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .cohort-actions-head .btn-sm span { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-wrap">
      <img src="/escudo.png" alt="USTA" onerror="this.parentElement.textContent='🎓'">
    </div>
    <div class="header-title">
      <h1>Apertura de Cohortes</h1>
      <p>Maestría en Análisis de Datos y Sistemas Inteligentes · USTA</p>
    </div>
  </div>
  <a href="/" class="btn-back">← Hub MADSI</a>
</header>

<main>

  <div class="kpi-row">
    <div class="kpi kpi-total">
      <div class="kpi-label">Total Candidatos</div>
      <div class="kpi-value" id="k-total">0</div>
    </div>
    <div class="kpi kpi-inscrito">
      <div class="kpi-label">Inscritos</div>
      <div class="kpi-value" id="k-inscrito">0</div>
    </div>
    <div class="kpi kpi-entrev">
      <div class="kpi-label">Entrevistados</div>
      <div class="kpi-value" id="k-entrev">0</div>
    </div>
    <div class="kpi kpi-admitido">
      <div class="kpi-label">Admitidos</div>
      <div class="kpi-value" id="k-admitido">0</div>
    </div>
    <div class="kpi kpi-matric">
      <div class="kpi-label">Matriculados</div>
      <div class="kpi-value" id="k-matric">0</div>
    </div>
  </div>

  <div class="page-toolbar">
    <h2>Cohortes</h2>
    <button class="btn-primary" onclick="openCohortModal()">+ Nueva Cohorte</button>
  </div>

  <div id="cohorts-container"></div>

</main>

<!-- Modal Cohorte -->
<div class="overlay" id="ov-cohort">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hd">
      <h2 id="cohort-modal-title">Nueva Cohorte</h2>
      <button class="btn-close" onclick="closeCohortModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="fg full">
        <label>Nombre de la cohorte *</label>
        <input type="text" id="c-nombre" placeholder="Ej: Cohorte 7 — 2026-I">
      </div>
      <div class="fg">
        <label>Año</label>
        <input type="text" id="c-anio" placeholder="2026">
      </div>
      <div class="fg">
        <label>Semestre</label>
        <select class="fs" id="c-semestre">
          <option value="I">I (Primer semestre)</option>
          <option value="II">II (Segundo semestre)</option>
        </select>
      </div>
      <div class="fg">
        <label>Fecha de inicio (aprox.)</label>
        <input type="date" id="c-fecha">
      </div>
      <div class="fg full">
        <label>Notas</label>
        <textarea id="c-notas" placeholder="Observaciones sobre la cohorte…"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="closeCohortModal()">Cancelar</button>
      <button class="btn-save" onclick="saveCohort()">Guardar Cohorte</button>
    </div>
  </div>
</div>

<!-- Modal Candidato -->
<div class="overlay" id="ov-cand">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-hd">
      <h2 id="cand-modal-title">Agregar Candidato</h2>
      <button class="btn-close" onclick="closeCandModal()">✕</button>
    </div>
    <div class="form-grid">
      <div class="fg">
        <label>Identificación *</label>
        <input type="text" id="f-doc" placeholder="1093847562">
      </div>
      <div class="fg">
        <label>Número de formulario</label>
        <input type="text" id="f-formulario" placeholder="Ej: F-2026-0042">
      </div>
      <div class="fg full">
        <label>Nombre completo *</label>
        <input type="text" id="f-nombre" placeholder="Ej: María Rodríguez Pérez">
      </div>
      <div class="fg">
        <label>Número de inscripción</label>
        <input type="text" id="f-inscripcion" placeholder="Ej: INS-2026-001">
      </div>
      <div class="fg">
        <label>Estado</label>
        <select class="fs" id="f-estado">
          <option value="Inscrito">Inscrito</option>
          <option value="Entrevistado">Entrevistado</option>
          <option value="Admitido">Admitido</option>
          <option value="Matriculado">Matriculado</option>
          <option value="Desistió">Desistió</option>
        </select>
      </div>
      <div class="fg">
        <label>Fecha de inscripción</label>
        <input type="date" id="f-fecha-ins">
      </div>
      <div class="fg">
        <label>Fecha de entrevista</label>
        <input type="date" id="f-fecha-ent">
      </div>
      <div class="fg full">
        <label>Correo electrónico</label>
        <input type="email" id="f-email" placeholder="correo@ejemplo.com">
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-cancel" onclick="closeCandModal()">Cancelar</button>
      <button class="btn-save" onclick="saveCand()">Guardar</button>
    </div>
  </div>
</div>

<script>
const KEY = 'madsi_cohortes_cand_v1';
let db = JSON.parse(localStorage.getItem(KEY) || '{"cohorts":[]}');
let editCohortId = null;
let editCandId = null;
let activeCohortId = null;

function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function save() { localStorage.setItem(KEY, JSON.stringify(db)); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(iso){ if(!iso)return '—'; const[y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }

const PILL = {
  'Inscrito':'p-inscrito','Entrevistado':'p-entrevistado',
  'Admitido':'p-admitido','Matriculado':'p-matriculado','Desistió':'p-desistio'
};
const DOT = {'Inscrito':'🔵','Entrevistado':'🟡','Admitido':'🟢','Matriculado':'🟣','Desistió':'🔴'};

function updateKPIs() {
  const all = db.cohorts.flatMap(c=>c.candidates);
  const n = s => all.filter(x=>x.estado===s).length;
  document.getElementById('k-total').textContent    = all.length;
  document.getElementById('k-inscrito').textContent = n('Inscrito');
  document.getElementById('k-entrev').textContent   = n('Entrevistado');
  document.getElementById('k-admitido').textContent = n('Admitido');
  document.getElementById('k-matric').textContent   = n('Matriculado');
}

function render() {
  updateKPIs();
  const el = document.getElementById('cohorts-container');
  if (!db.cohorts.length) {
    el.innerHTML = `<div class="empty-cohorts">📅<p>Aún no hay cohortes registradas.</p>
      <button class="btn-primary" onclick="openCohortModal()">+ Nueva Cohorte</button></div>`;
    return;
  }
  el.innerHTML = db.cohorts.map(c => {
    const open = c.open !== false;
    return `
    <div class="cohort-card${open?' open':''}" id="card-${c.id}">
      <div class="cohort-head" onclick="toggleCohort('${c.id}')">
        <span class="cohort-chevron">▶</span>
        <span class="cohort-name">${esc(c.nombre)}</span>
        <span class="cohort-meta">${c.anio||''}${c.semestre?' · Sem. '+c.semestre:''}</span>
        <span class="cohort-badge">${c.candidates.length} candidato${c.candidates.length!==1?'s':''}</span>
        <div class="cohort-actions-head" onclick="event.stopPropagation()">
          <button class="btn-sm accent" onclick="openCandModal('${c.id}')">+ Candidato</button>
          <button class="btn-sm" onclick="openCohortModal('${c.id}')">✏️</button>
          <button class="btn-sm danger" onclick="deleteCohort('${c.id}')">🗑</button>
        </div>
      </div>
      <div class="cohort-body">${renderCandidates(c)}</div>
    </div>`;
  }).join('');
}

function renderCandidates(c) {
  if (!c.candidates.length) return `
    <div class="empty">Sin candidatos aún.
      <button class="btn-sm accent" style="margin-left:.5rem" onclick="openCandModal('${c.id}')">+ Agregar</button>
    </div>`;

  const rows = c.candidates.map(x=>`
    <tr>
      <td><div class="td-name">${esc(x.nombre)}</div><div class="td-doc">${esc(x.documento||'')}</div></td>
      <td class="td-small">${esc(x.formulario||'—')}</td>
      <td class="td-small">${esc(x.numInscripcion||'—')}</td>
      <td><span class="pill ${PILL[x.estado]||''}">${DOT[x.estado]||''} ${esc(x.estado)}</span></td>
      <td class="td-gray">${fmt(x.fechaInscripcion)}</td>
      <td class="td-gray">${fmt(x.fechaEntrevista)}</td>
      <td><div class="td-acts">
        <button class="btn-icon" onclick="openCandModal('${c.id}','${x.id}')">✏️</button>
        <button class="btn-icon del" onclick="deleteCand('${c.id}','${x.id}')">🗑</button>
      </div></td>
    </tr>`).join('');

  return `
    <div class="cand-toolbar">
      <div class="search-box">
        <span class="ico">🔍</span>
        <input type="text" placeholder="Buscar candidato…" oninput="filterTable('${c.id}',this.value)">
      </div>
      <select class="filter" id="sel-${c.id}" onchange="filterTable('${c.id}','',this.value)">
        <option value="">Todos los estados</option>
        <option value="Inscrito">Inscrito</option>
        <option value="Entrevistado">Entrevistado</option>
        <option value="Admitido">Admitido</option>
        <option value="Matriculado">Matriculado</option>
        <option value="Desistió">Desistió</option>
      </select>
      <button class="btn-export" onclick="exportCSV('${c.id}')">⬇ CSV</button>
    </div>
    <div style="overflow-x:auto">
    <table id="tbl-${c.id}">
      <thead><tr>
        <th>Nombre / Identificación</th><th>N° Formulario</th><th>N° Inscripción</th>
        <th>Estado</th><th>F. Inscripción</th><th>F. Entrevista</th><th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
}

function filterTable(cId, q, status) {
  const c = db.cohorts.find(x=>x.id===cId);
  const tbody = document.querySelector(`#tbl-${cId} tbody`);
  if (!c||!tbody) return;
  const sq=(q||'').toLowerCase();
  const ss=status!==undefined?status:(document.getElementById('sel-'+cId)?.value||'');
  const rows=c.candidates.filter(x=>{
    const mq=!sq||[x.nombre,x.documento,x.formulario,x.numInscripcion].join(' ').toLowerCase().includes(sq);
    return mq&&(!ss||x.estado===ss);
  });
  tbody.innerHTML=rows.map(x=>`
    <tr>
      <td><div class="td-name">${esc(x.nombre)}</div><div class="td-doc">${esc(x.documento||'')}</div></td>
      <td class="td-small">${esc(x.formulario||'—')}</td>
      <td class="td-small">${esc(x.numInscripcion||'—')}</td>
      <td><span class="pill ${PILL[x.estado]||''}">${DOT[x.estado]||''} ${esc(x.estado)}</span></td>
      <td class="td-gray">${fmt(x.fechaInscripcion)}</td>
      <td class="td-gray">${fmt(x.fechaEntrevista)}</td>
      <td><div class="td-acts">
        <button class="btn-icon" onclick="openCandModal('${cId}','${x.id}')">✏️</button>
        <button class="btn-icon del" onclick="deleteCand('${cId}','${x.id}')">🗑</button>
      </div></td>
    </tr>`).join('')||`<tr><td colspan="7" class="empty">Sin resultados.</td></tr>`;
}

function toggleCohort(id) {
  const c=db.cohorts.find(x=>x.id===id);
  if(c) c.open=!(c.open!==false);
  save();
  document.getElementById('card-'+id)?.classList.toggle('open');
}

// ── COHORT MODAL ──
function openCohortModal(id=null) {
  editCohortId=id;
  const c=id?db.cohorts.find(x=>x.id===id):null;
  document.getElementById('cohort-modal-title').textContent=id?'Editar Cohorte':'Nueva Cohorte';
  document.getElementById('c-nombre').value   = c?.nombre  ||'';
  document.getElementById('c-anio').value     = c?.anio    ||new Date().getFullYear();
  document.getElementById('c-semestre').value = c?.semestre||'I';
  document.getElementById('c-fecha').value    = c?.fecha   ||'';
  document.getElementById('c-notas').value    = c?.notas   ||'';
  document.getElementById('ov-cohort').classList.add('open');
  setTimeout(()=>document.getElementById('c-nombre').focus(),80);
}
function closeCohortModal(){ document.getElementById('ov-cohort').classList.remove('open'); editCohortId=null; }

function saveCohort(){
  const nombre=document.getElementById('c-nombre').value.trim();
  if(!nombre){alert('El nombre es obligatorio.');return;}
  const data={nombre,anio:document.getElementById('c-anio').value.trim(),
    semestre:document.getElementById('c-semestre').value,
    fecha:document.getElementById('c-fecha').value,
    notas:document.getElementById('c-notas').value.trim()};
  if(editCohortId){
    const c=db.cohorts.find(x=>x.id===editCohortId);
    if(c) Object.assign(c,data);
  } else {
    db.cohorts.push({id:uid(),...data,open:true,candidates:[]});
  }
  save(); closeCohortModal(); render();
}

function deleteCohort(id){
  const c=db.cohorts.find(x=>x.id===id);
  if(!confirm(`¿Eliminar la cohorte "${c?.nombre}" y todos sus candidatos?`))return;
  db.cohorts=db.cohorts.filter(x=>x.id!==id);
  save(); render();
}

// ── CANDIDATO MODAL ──
function openCandModal(cohortId,candId=null){
  activeCohortId=cohortId; editCandId=candId;
  const c=db.cohorts.find(x=>x.id===cohortId);
  const x=candId?c?.candidates.find(y=>y.id===candId):null;
  document.getElementById('cand-modal-title').textContent=candId?'Editar Candidato':'Agregar Candidato — '+( c?.nombre||'');
  document.getElementById('f-doc').value        = x?.documento||'';
  document.getElementById('f-formulario').value  = x?.formulario||'';
  document.getElementById('f-nombre').value      = x?.nombre||'';
  document.getElementById('f-inscripcion').value = x?.numInscripcion||'';
  document.getElementById('f-estado').value      = x?.estado||'Inscrito';
  document.getElementById('f-fecha-ins').value   = x?.fechaInscripcion||new Date().toISOString().split('T')[0];
  document.getElementById('f-fecha-ent').value   = x?.fechaEntrevista||'';
  document.getElementById('f-email').value       = x?.email||'';
  document.getElementById('ov-cand').classList.add('open');
  setTimeout(()=>document.getElementById('f-nombre').focus(),80);
}
function closeCandModal(){ document.getElementById('ov-cand').classList.remove('open'); editCandId=null; activeCohortId=null; }

function saveCand(){
  const nombre=document.getElementById('f-nombre').value.trim();
  if(!nombre){alert('El nombre es obligatorio.');return;}
  const c=db.cohorts.find(x=>x.id===activeCohortId);
  if(!c) return;
  const data={
    documento:       document.getElementById('f-doc').value.trim(),
    formulario:      document.getElementById('f-formulario').value.trim(),
    nombre,
    numInscripcion:  document.getElementById('f-inscripcion').value.trim(),
    estado:          document.getElementById('f-estado').value,
    fechaInscripcion:document.getElementById('f-fecha-ins').value,
    fechaEntrevista: document.getElementById('f-fecha-ent').value,
    email:           document.getElementById('f-email').value.trim(),
  };
  if(editCandId){
    const idx=c.candidates.findIndex(y=>y.id===editCandId);
    if(idx>=0) c.candidates[idx]={...c.candidates[idx],...data};
  } else {
    c.candidates.push({id:uid(),...data});
  }
  save(); closeCandModal(); render();
}

function deleteCand(cohortId,candId){
  const c=db.cohorts.find(x=>x.id===cohortId);
  const x=c?.candidates.find(y=>y.id===candId);
  if(!confirm(`¿Eliminar a "${x?.nombre}"?`))return;
  c.candidates=c.candidates.filter(y=>y.id!==candId);
  save(); render();
}

function exportCSV(cohortId){
  const c=db.cohorts.find(x=>x.id===cohortId);
  if(!c)return;
  const h=['Identificación','Nombre','N° Formulario','N° Inscripción','Estado','Fecha Inscripción','Fecha Entrevista','Correo'];
  const lines=[h.join(','),...c.candidates.map(x=>[
    x.documento,x.nombre,x.formulario,x.numInscripcion,x.estado,x.fechaInscripcion,x.fechaEntrevista,x.email
  ].map(v=>`"${(v||'').replace(/"/g,'""')}"`).join(','))];
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`candidatos_${c.nombre.replace(/\s+/g,'_')}.csv`;a.click();
}

document.getElementById('ov-cohort').addEventListener('click',function(e){if(e.target===this)closeCohortModal();});
document.getElementById('ov-cand').addEventListener('click',function(e){if(e.target===this)closeCandModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeCohortModal();closeCandModal();}});

render();
</script>
</body>
</html>
